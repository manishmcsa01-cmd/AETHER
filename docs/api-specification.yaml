                  type: string
                  format: uuid
                department_id:
                  type: string
                  format: uuid
                format:
                  type: string
                  enum: [pdf, csv, json]
                  default: pdf
      responses:
        '202':
          description: Report generation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: generating
        '401':
          $ref: '#/components/responses/Unauthorized'

  /audit/reports/{report_id}:
    parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Audit]
      operationId: getReport
      summary: Get audit report
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit/executive-summary:
    get:
      tags: [Audit]
      operationId: getExecutiveSummary
      summary: Get executive summary
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter]
            default: month
      responses:
        '200':
          description: Executive summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: string
                  total_agents:
                    type: integer
                  active_agents:
                    type: integer
                  total_violations:
                    type: integer
                  open_violations:
                    type: integer
                  compliance_score:
                    type: number
                    format: float
                  total_cost:
                    type: number
                    format: float
                  risk_distribution:
                    type: object
                    properties:
                      critical:
                        type: integer
                      high:
                        type: integer
                      medium:
                        type: integer
                      low:
                        type: integer
                      minimal:
                        type: integer
                  top_risks:
                    type: array
                    items:
                      type: object
                      properties:
                        agent_name:
                          type: string
                        risk_score:
                          type: number
                        risk_level:
                          $ref: '#/components/schemas/RiskLevelEnum'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────
  # KNOWLEDGE GRAPH
  # ─────────────────────────────────────────────
  /knowledge-graph/nodes:
    get:
      tags: [Knowledge Graph]
      operationId: listNodes
      summary: List knowledge graph nodes
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: node_type
          in: query
          schema:
            type: string
            enum: [Agent, Platform, Department, User, Policy, Risk, DataSource, Credential, ComplianceFramework]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated nodes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgeGraphNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Knowledge Graph]
      operationId: createNode
      summary: Create knowledge graph node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeGraphNodeCreate'
      responses:
        '201':
          description: Node created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /knowledge-graph/nodes/{node_id}:
    parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Knowledge Graph]
      operationId: getNode
      summary: Get node details
      responses:
        '200':
          description: Node details with connected edges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /knowledge-graph/edges:
    get:
      tags: [Knowledge Graph]
      operationId: listEdges
      summary: List knowledge graph edges
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: edge_type
          in: query
          schema:
            type: string
            enum: [DEPLOYED_ON, OWNED_BY, BELONGS_TO, GOVERNED_BY, ACCESSES, HAS_CREDENTIAL, COMMUNICATES_WITH, DEPENDS_ON, VIOLATES]
        - name: source_node_id
          in: query
          schema:
            type: string
            format: uuid
        - name: target_node_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated edges
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgeGraphEdge'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Knowledge Graph]
      operationId: createEdge
      summary: Create knowledge graph edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeGraphEdgeCreate'
      responses:
        '201':
          description: Edge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphEdge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /knowledge-graph/query:
    post:
      tags: [Knowledge Graph]
      operationId: queryGraph
      summary: Execute graph query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQuery'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeGraphNode'
                  edges:
                    type: array
                    items:
                      $ref: '#/components/schemas/KnowledgeGraphEdge'
                  total_nodes:
                    type: integer
                  total_edges:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ─────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login with Entra ID
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/token:
    post:
      tags: [Auth]
      operationId: getToken
      summary: Get access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, client_credentials]
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get current user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Logout and invalidate tokens
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

# ═══════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════
components:
  # ─── Security Schemes ───────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by Azure Entra ID
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            openid: OpenID Connect
            profile: User profile
            email: Email address
            api://aether-platform/agents.read: Read agents
            api://aether-platform/agents.write: Write agents
            api://aether-platform/admin: Full admin access
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Platform-issued API key

  # ─── Parameters ─────────────────────────────
  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortByParam:
      name: sort_by
      in: query
      description: Field to sort by
      schema:
        type: string
        default: created_at
    SortOrderParam:
      name: sort_order
      in: query
      description: Sort order
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    AgentIdParam:
      name: agent_id
      in: path
      required: true
      description: Agent UUID
      schema:
        type: string
        format: uuid

  # ─── Responses ──────────────────────────────
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
              details: []
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: The requested resource was not found
              details: []
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ─── Schemas ────────────────────────────────
  schemas:
    # --- Enums ---
    AgentStatusEnum:
      type: string
      enum: [discovered, onboarding, active, inactive, suspended, offboarded, decommissioned]
    AgentPlatformEnum:
      type: string
      enum: [copilot_studio, agentforce, databricks, aws_bedrock, google_vertex, langchain, langgraph, autogen, custom]
    AgentEnvironmentEnum:
      type: string
      enum: [production, staging, development, testing]
    MonitoringMethodEnum:
      type: string
      enum: [connector_pull, sdk_push, webhook, hybrid]
    RiskLevelEnum:
      type: string
      enum: [critical, high, medium, low, minimal]
    ComplianceStatusEnum:
      type: string
      enum: [compliant, non_compliant, partially_compliant, under_review, not_assessed]
    PolicyEnforcementEnum:
      type: string
      enum: [enforce, warn, audit, disabled]
    EventSeverityEnum:
      type: string
      enum: [critical, high, medium, low, info]
    IntegrationStatusEnum:
      type: string
      enum: [active, inactive, error, configuring]
    ScanStatusEnum:
      type: string
      enum: [pending, running, completed, failed]
    CredentialTypeEnum:
      type: string
      enum: [api_key, oauth_token, service_account, managed_identity, certificate]
    ViolationStatusEnum:
      type: string
      enum: [open, acknowledged, mitigating, resolved, false_positive]
    FindingSeverityEnum:
      type: string
      enum: [critical, high, medium, low, informational]

    # --- Core Schemas ---
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        external_id:
          type: string
        name:
          type: string
        description:
          type: string
        platform:
          $ref: '#/components/schemas/AgentPlatformEnum'
        environment:
          $ref: '#/components/schemas/AgentEnvironmentEnum'
        status:
          $ref: '#/components/schemas/AgentStatusEnum'
        version:
          type: string
        endpoint_url:
          type: string
          format: uri
        region:
          type: string
        runtime:
          type: string
        owner_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        monitoring_method:
          $ref: '#/components/schemas/MonitoringMethodEnum'
        tags:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
        onboarded_at:
          type: string
          format: date-time
          nullable: true
        offboarded_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentCreate:
      type: object
      required: [name, platform]
      properties:
        external_id:
          type: string
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        platform:
          $ref: '#/components/schemas/AgentPlatformEnum'
        environment:
          $ref: '#/components/schemas/AgentEnvironmentEnum'
        endpoint_url:
          type: string
          format: uri
        region:
          type: string
        runtime:
          type: string
        version:
          type: string
        owner_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        monitoring_method:
          $ref: '#/components/schemas/MonitoringMethodEnum'
        tags:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
        capabilities:
          type: array
          items:
            type: string
        data_access:
          type: array
          items:
            type: string
        pii_access:
          type: boolean
          default: false
        financial_access:
          type: boolean
          default: false
        external_access:
          type: boolean
          default: false

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        environment:
          $ref: '#/components/schemas/AgentEnvironmentEnum'
        status:
          $ref: '#/components/schemas/AgentStatusEnum'
        endpoint_url:
          type: string
          format: uri
        region:
          type: string
        runtime:
          type: string
        version:
          type: string
        owner_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        monitoring_method:
          $ref: '#/components/schemas/MonitoringMethodEnum'
        tags:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object

    AgentActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        activity_type:
          type: string
          enum: [inference, tool_call, data_access, api_call, file_operation, user_interaction]
        description:
          type: string
        input_summary:
          type: string
        output_summary:
          type: string
        tokens_used:
          type: integer
        latency_ms:
          type: integer
        was_successful:
          type: boolean
        error_message:
          type: string
          nullable: true
        metadata:
          type: object
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    AgentMetrics:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        metrics:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              values:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    value:
                      type: number
              unit:
                type: string
              aggregate:
                type: object
                properties:
                  avg:
                    type: number
                  min:
                    type: number
                  max:
                    type: number
                  p95:
                    type: number
                  p99:
                    type: number

    AgentHealth:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        is_healthy:
          type: boolean
        uptime_percentage:
          type: number
          format: float
        avg_latency_ms:
          type: number
          format: float
        p95_latency_ms:
          type: number
          format: float
        p99_latency_ms:
          type: number
          format: float
        success_rate:
          type: number
          format: float
        error_rate:
          type: number
          format: float
        last_heartbeat_at:
          type: string
          format: date-time
        last_error_at:
          type: string
          format: date-time
          nullable: true
        last_error_message:
          type: string
          nullable: true
        health_details:
          type: object
        recorded_at:
          type: string
          format: date-time

    # --- Governance Schemas ---
    Policy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
        enforcement:
          $ref: '#/components/schemas/PolicyEnforcementEnum'
        rules:
          type: object
        scope:
          type: object
        priority:
          type: integer
        is_active:
          type: boolean
        created_by:
          type: string
          format: uuid
        approved_by:
          type: string
          format: uuid
          nullable: true
        effective_from:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
          nullable: true
        version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PolicyCreate:
      type: object
      required: [name, category, enforcement, rules]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        enforcement:
          $ref: '#/components/schemas/PolicyEnforcementEnum'
        rules:
          type: object
        scope:
          type: object
        priority:
          type: integer
          default: 0
        is_active:
          type: boolean
          default: true
        effective_from:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time

    Violation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        policy_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        violation_status:
          $ref: '#/components/schemas/ViolationStatusEnum'
        severity:
          $ref: '#/components/schemas/EventSeverityEnum'
        description:
          type: string
        evidence:
          type: object
        remediation_steps:
          type: string
        resolved_by:
          type: string
          format: uuid
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolution_notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ViolationUpdate:
      type: object
      properties:
        violation_status:
          $ref: '#/components/schemas/ViolationStatusEnum'
        resolution_notes:
          type: string

    # --- Compliance Schemas ---
    ComplianceFramework:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        description:
          type: string
        authority:
          type: string
        effective_date:
          type: string
          format: date
        is_active:
          type: boolean
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ComplianceFrameworkCreate:
      type: object
      required: [name, version, authority]
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        authority:
          type: string
        effective_date:
          type: string
          format: date
        is_active:
          type: boolean
          default: true
        metadata:
          type: object

    ComplianceControl:
      type: object
      properties:
        id:
          type: string
          format: uuid
        framework_id:
          type: string
          format: uuid
        control_id_code:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        requirements:
          type: object
        test_procedures:
          type: object
        is_automated:
          type: boolean
        created_at:
          type: string
          format: date-time

    ComplianceFinding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        control_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        severity:
          $ref: '#/components/schemas/FindingSeverityEnum'
        title:
          type: string
        description:
          type: string
        evidence:
          type: object
        remediation:
          type: string
        status:
          $ref: '#/components/schemas/ViolationStatusEnum'
        found_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # --- Risk Schemas ---
    RiskAssessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        overall_risk_level:
          $ref: '#/components/schemas/RiskLevelEnum'
        risk_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
        data_sensitivity_score:
          type: number
          format: float
        autonomy_score:
          type: number
          format: float
        impact_score:
          type: number
          format: float
        access_scope_score:
          type: number
          format: float
        pii_access:
          type: boolean
        financial_access:
          type: boolean
        external_access:
          type: boolean
        risk_factors:
          type: object
        assessed_by:
          type: string
        assessed_at:
          type: string
          format: date-time
        next_assessment_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    RiskScoreSummary:
      type: object
      properties:
        total_agents:
          type: integer
        average_risk_score:
          type: number
          format: float
        distribution:
          type: object
          properties:
            critical:
              type: integer
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
            minimal:
              type: integer
        trend:
          type: string
          enum: [improving, stable, degrading]

    # --- Cost Schemas ---
    CostSummary:
      type: object
      properties:
        period:
          type: string
        total_cost:
          type: number
          format: float
        token_cost:
          type: number
          format: float
        compute_cost:
          type: number
          format: float
        api_call_cost:
          type: number
          format: float
        currency:
          type: string
          default: USD
        cost_by_group:
          type: array
          items:
            type: object
            properties:
              group_id:
                type: string
              group_name:
                type: string
              total_cost:
                type: number
                format: float
        trend_percentage:
          type: number
          format: float
          description: Cost change percentage vs. previous period

    CostDetail:
      type: object
      properties:
        entity_id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [agent, department]
        entity_name:
          type: string
        total_cost:
          type: number
          format: float
        token_cost:
          type: number
          format: float
        compute_cost:
          type: number
          format: float
        api_call_cost:
          type: number
          format: float
        storage_cost:
          type: number
          format: float
        total_tokens:
          type: integer
        total_api_calls:
          type: integer
        currency:
          type: string
          default: USD
        daily_breakdown:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              cost:
                type: number
                format: float

    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [tenant, department, agent]
        scope_id:
          type: string
          format: uuid
        budget_amount:
          type: number
          format: float
        spent_amount:
          type: number
          format: float
        remaining_amount:
          type: number
          format: float
        utilization_percentage:
          type: number
          format: float
        currency:
          type: string
          default: USD
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        alert_threshold_percentage:
          type: number
          format: float
          default: 80

    BudgetCreate:
      type: object
      required: [scope, budget_amount, period_start, period_end]
      properties:
        scope:
          type: string
          enum: [tenant, department, agent]
        scope_id:
          type: string
          format: uuid
        budget_amount:
          type: number
          format: float
        currency:
          type: string
          default: USD
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        alert_threshold_percentage:
          type: number
          format: float
          default: 80

    # --- Identity Schemas ---
    Credential:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        credential_type:
          $ref: '#/components/schemas/CredentialTypeEnum'
        credential_identifier:
          type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_rotated_at:
          type: string
          format: date-time
        rotation_policy_days:
          type: integer
        is_active:
          type: boolean
        metadata:
          type: object
        created_at:
          type: string
          format: date-time

    CredentialCreate:
      type: object
      required: [agent_id, credential_type]
      properties:
        agent_id:
          type: string
          format: uuid
        credential_type:
          $ref: '#/components/schemas/CredentialTypeEnum'
        rotation_policy_days:
          type: integer
          default: 90
        metadata:
          type: object

    # --- Event Schema ---
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        source:
          type: string
        severity:
          $ref: '#/components/schemas/EventSeverityEnum'
        payload:
          type: object
        correlation_id:
          type: string
          format: uuid
        processed:
          type: boolean
        processed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # --- Integration Schemas ---
    Integration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          $ref: '#/components/schemas/AgentPlatformEnum'
        integration_status:
          $ref: '#/components/schemas/IntegrationStatusEnum'
        connection_config:
          type: object
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        sync_frequency_minutes:
          type: integer
        error_message:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IntegrationCreate:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
        platform:
          $ref: '#/components/schemas/AgentPlatformEnum'
        connection_config:
          type: object
          description: Platform-specific connection configuration
        auth_config:
          type: object
          description: Authentication configuration (encrypted at rest)
        sync_frequency_minutes:
          type: integer
          default: 15

    # --- Discovery Schema ---
    DiscoveryScan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        integration_id:
          type: string
          format: uuid
        scan_status:
          $ref: '#/components/schemas/ScanStatusEnum'
        platform:
          $ref: '#/components/schemas/AgentPlatformEnum'
        discovered_agents_count:
          type: integer
        new_agents_count:
          type: integer
        updated_agents_count:
          type: integer
        scan_started_at:
          type: string
          format: date-time
        scan_completed_at:
          type: string
          format: date-time
          nullable: true
        scan_results:
          type: object
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # --- Audit Schemas ---
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
        actor_type:
          type: string
          enum: [user, agent, system]
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        changes:
          type: object
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time

    AuditReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        report_type:
          type: string
          enum: [compliance, risk, cost, activity, executive]
        status:
          type: string
          enum: [generating, completed, failed]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        download_url:
          type: string
          format: uri
          nullable: true
        summary:
          type: object
        created_at:
          type: string
          format: date-time

    # --- Knowledge Graph Schemas ---
    KnowledgeGraphNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        node_type:
          type: string
          enum: [Agent, Platform, Department, User, Policy, Risk, DataSource, Credential, ComplianceFramework]
        entity_id:
          type: string
          format: uuid
        label:
          type: string
        properties:
          type: object
        connected_edges:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeGraphEdge'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KnowledgeGraphNodeCreate:
      type: object
      required: [node_type, label]
      properties:
        node_type:
          type: string
          enum: [Agent, Platform, Department, User, Policy, Risk, DataSource, Credential, ComplianceFramework]
        entity_id:
          type: string
          format: uuid
        label:
          type: string
        properties:
          type: object

    KnowledgeGraphEdge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_node_id:
          type: string
          format: uuid
        target_node_id:
          type: string
          format: uuid
        edge_type:
          type: string
          enum: [DEPLOYED_ON, OWNED_BY, BELONGS_TO, GOVERNED_BY, ACCESSES, HAS_CREDENTIAL, COMMUNICATES_WITH, DEPENDS_ON, VIOLATES]
        weight:
          type: number
          format: float
        properties:
          type: object
        created_at:
          type: string
          format: date-time

    KnowledgeGraphEdgeCreate:
      type: object
      required: [source_node_id, target_node_id, edge_type]
      properties:
        source_node_id:
          type: string
          format: uuid
        target_node_id:
          type: string
          format: uuid
        edge_type:
          type: string
          enum: [DEPLOYED_ON, OWNED_BY, BELONGS_TO, GOVERNED_BY, ACCESSES, HAS_CREDENTIAL, COMMUNICATES_WITH, DEPENDS_ON, VIOLATES]
        weight:
          type: number
          format: float
          default: 1.0
        properties:
          type: object

    GraphQuery:
      type: object
      required: [query_type]
      properties:
        query_type:
          type: string
          enum: [neighbors, path, subgraph, pattern]
        start_node_id:
          type: string
          format: uuid
        end_node_id:
          type: string
          format: uuid
        edge_types:
          type: array
          items:
            type: string
        node_types:
          type: array
          items:
            type: string
        max_depth:
          type: integer
          default: 3
          maximum: 10
        filters:
          type: object

    # --- Auth Schemas ---
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended, pending]
        created_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        preferences:
          type: object
        last_login_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: Azure Entra ID token
        redirect_uri:
          type: string
          format: uri

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds
        refresh_token:
          type: string
        scope:
          type: string

    # --- Common Schemas ---
    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          description: Total number of items
        page:
          type: integer
          description: Current page number
        page_size:
          type: integer
          description: Items per page
        total_pages:
          type: integer
          description: Total number of pages

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string

    BulkOperationRequest:
      type: object
      required: [operation, agent_ids]
      properties:
        operation:
          type: string
          enum: [onboard, offboard, suspend, activate, delete, update_tags]
        agent_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
        parameters:
          type: object
          description: Operation-specific parameters

    BulkOperationResponse:
      type: object
      properties:
        operation:
          type: string
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              agent_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [success, failed]
              error:
                type: string
                nullable: true
